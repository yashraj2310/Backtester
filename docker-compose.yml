version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    environment:
      - DATABASE_URL=postgresql://postgres:mathsfactorial@db:5432/postgres?schema=public
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mathsfactorial
      - POSTGRES_DB=postgres
    ports:
      - '5433:5432' 
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: